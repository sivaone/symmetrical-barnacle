name: Generate Podcast Feed

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Generate Feed
        run: python feed.py
      - name: Push repo
        run: |
          git config user.name github-actions
          git config usre.email github-actions@github.com
          git add .
          git commit -m "Generate new feed"
          git push
          
